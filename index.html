<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AMR 50 Games - 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    overflow:auto;
    color:white;
    padding:30px;
    background:
      radial-gradient(circle at 50% 0%,#31558d,#070b12 65%);
}

.logo{
    text-align:center;
    font-size:55px;
    font-weight:900;
    letter-spacing:5px;
}

.subtitle{
    text-align:center;
    color:#b9c7dc;
    margin:10px 0 30px;
}

.games{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:
      repeat(auto-fit,minmax(210px,1fr));
    gap:14px;
}

.card{
    min-height:140px;
    padding:18px;
    border-radius:16px;
    cursor:pointer;
    border:1px solid #ffffff25;
    background:
      linear-gradient(145deg,#1c2d47,#0b111b);
    transition:.2s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#66b5ff;
    box-shadow:0 15px 35px #000;
}

.number{
    color:#7387a5;
    font-size:12px;
}

.card h2{
    margin-top:9px;
    font-size:18px;
}

.category{
    color:#83b8ff;
    font-size:13px;
    margin-top:8px;
}

#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    color:white;
}

.panel{
    background:#000b;
    border:1px solid #ffffff25;
    border-radius:12px;
    padding:12px 16px;
    backdrop-filter:blur(5px);
}

#top{
    position:absolute;
    left:15px;
    right:15px;
    top:15px;
    display:flex;
    justify-content:space-between;
}

#mission{
    position:absolute;
    top:85px;
    left:50%;
    transform:translateX(-50%);
    min-width:300px;
    text-align:center;
}

#controls{
    position:absolute;
    left:15px;
    bottom:15px;
    line-height:1.5;
}

#back{
    position:absolute;
    right:15px;
    bottom:15px;
    pointer-events:auto;
    border:0;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
}

#crosshair{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:26px;
}

#message{
    position:absolute;
    bottom:130px;
    left:50%;
    transform:translateX(-50%);
}

#minimap{
    position:absolute;
    top:75px;
    right:15px;
    width:170px;
    height:170px;
    border:2px solid white;
    border-radius:50%;
}

#loading{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:#05080d;
    color:white;
    font-size:25px;
}
</style>

/* =====================================================
                     GLOBAL VARIABLES
===================================================== */

let scene;
let camera;
let renderer;
let clock;

let player;

let humans=[];
let enemies=[];
let cars=[];
let buildings=[];
let trees=[];
let props=[];
let projectiles=[];

let currentCar=null;

let keys={};

let gameIndex=0;
let gameType="";

let score=0;
let health=100;
let level=1;

let running=false;

let playerSpeed=.16;

let yaw=0;

let lastTime=0;


/* =====================================================
                       MENU
===================================================== */

const gameList=
document.getElementById("gameList");

GAMES.forEach((g,i)=>{

    const card=
    document.createElement("div");

    card.className="card";

    card.innerHTML=`

        <div class="number">
            GAME ${i+1}
        </div>

        <h2>
            ${g[2]} ${g[0]}
        </h2>

        <div class="category">
            ${g[1]}
        </div>
    `;

    card.onclick=()=>{
        startGame(i);
    };

    gameList.appendChild(card);

});


/* =====================================================
                       START GAME
===================================================== */

function startGame(index){

    gameIndex=index;
    gameType=GAMES[index][1];

    document.getElementById(
        "loading"
    ).style.display="flex";

    setTimeout(()=>{

        document.getElementById(
            "menu"
        ).style.display="none";

        document.getElementById(
            "hud"
        ).style.display="block";

        document.getElementById(
            "gameTitle"
        ).textContent=
            GAMES[index][2]+" "+
            GAMES[index][0];

        if(!renderer){
            init();
        }

        buildGame();

        running=true;

        document.getElementById(
            "loading"
        ).style.display="none";

    },100);

}


/* =====================================================
                         INIT
===================================================== */

function init(){

    scene=
    new THREE.Scene();

    camera=
    new THREE.PerspectiveCamera(
        70,
        innerWidth/innerHeight,
        .1,
        2000
    );

    renderer=
    new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled=true;

    document.body.appendChild(
        renderer.domElement
    );

    clock=new THREE.Clock();


    /* LIGHT */

    const hemi=
    new THREE.HemisphereLight(
        0xffffff,
        0x39434f,
        2.2
    );

    scene.add(hemi);


    const sun=
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

    sun.position.set(
        300,
        500,
        200
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    scene.add(sun);


    setupInput();

}


/* =====================================================
                      CLEAR WORLD
===================================================== */

function clearWorld(){

    while(scene.children.length>2){

        scene.remove(
            scene.children[
                scene.children.length-1
            ]
        );

    }

    humans=[];
    enemies=[];
    cars=[];
    buildings=[];
    trees=[];
    props=[];
    projectiles=[];

    currentCar=null;

}

/* =====================================================
                  MATERIAL HELPERS
===================================================== */

function mat(color){

    return new THREE.MeshStandardMaterial({
        color:color
    });

}


function cube(
    x,y,z,
    sx,sy,sz,
    color
){

    const o=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            sx,sy,sz
        ),

        mat(color)

    );

    o.position.set(
        x,y,z
    );

    o.castShadow=true;
    o.receiveShadow=true;

    scene.add(o);

    props.push(o);

    return o;

}


function sphere(
    x,y,z,
    r,
    color
){

    const o=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            r,
            16,
            12
        ),

        mat(color)

    );

    o.position.set(
        x,y,z
    );

    o.castShadow=true;

    scene.add(o);

    props.push(o);

    return o;

}


function floor(
    color,
    size=1000
){

    const f=
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            size,
            size
        ),

        mat(color)

    );

    f.rotation.x=-Math.PI/2;

    f.receiveShadow=true;

    scene.add(f);

}


/* =====================================================
                        HUMAN
===================================================== */

function createHuman(
    bodyColor=0x345477,
    scale=1
){

    const g=
    new THREE.Group();


    /* torso */

    const torso=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            1.8,
            2.8,
            1
        ),

        mat(bodyColor)

    );

    torso.position.y=4.5;

    g.add(torso);


    /* neck */

    const neck=
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .35,
            .35,
            .4,
            12
        ),

        mat(0xb87958)

    );

    neck.position.y=6.05;

    g.add(neck);


    /* head */

    const head=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .85,
            20,
            16
        ),

        mat(0xb87958)

    );

    head.position.y=7.05;

    g.add(head);


    /* hair */

    const hair=
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .87,
            20,
            12,
            0,
            Math.PI*2,
            0,
            Math.PI/2
        ),

        mat(0x19130f)

    );

    hair.position.y=7.3;

    g.add(hair);


    /* arms */

    const armL=
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .22,
            2.2,
            6,
            10
        ),
        mat(bodyColor)
    );

    armL.position.set(
        -1.2,
        4.5,
        0
    );

    g.add(armL);


    const armR=armL.clone();

    armR.position.x=1.2;

    g.add(armR);


    /* legs */

    const legL=
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .27,
            2.3,
            6,
            10
        ),
        mat(0x20252d)
    );

    legL.position.set(
        -.5,
        1.9,
        0
    );

    g.add(legL);


    const legR=legL.clone();

    legR.position.x=.5;

    g.add(legR);


    g.scale.setScalar(scale);

    g.userData={
        armL,
        armR,
        legL,
        legR,
        walkOffset:
            Math.random()*10,
        speed:
            .02+Math.random()*.05
    };


    return g;

}


/* =====================================================
                     PLAYER
===================================================== */

function createPlayer(){

    player=
    createHuman(
        0x2369aa,
        1.25
    );

    player.position.set(
        0,
        0,
        0
    );

    scene.add(player);

}


/* =====================================================
                   HUMAN ANIMATION
===================================================== */

function animateHuman(h){

    if(!h.userData.legL)return;

    const t=
        performance.now()*.008+
        h.userData.walkOffset;


    h.userData.armL.rotation.x=
        Math.sin(t)*.45;

    h.userData.armR.rotation.x=
        -Math.sin(t)*.45;

    h.userData.legL.rotation.x=
        -Math.sin(t)*.5;

    h.userData.legR.rotation.x=
        Math.sin(t)*.5;

}


/* =====================================================
                  CREATE NPC GROUP
===================================================== */

function addHumans(
    count,
    area=250
){

    for(let i=0;i<count;i++){

        const colors=[
            0x2e5275,
            0x5c3d2e,
            0x6a6a6a,
            0x3c7042,
            0x743d54,
            0x444444
        ];

        const h=
        createHuman(
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ],
            1+Math.random()*.25
        );

        h.position.set(
            (Math.random()-.5)*area,
            0,
            (Math.random()-.5)*area
        );

        scene.add(h);

        humans.push(h);

    }

}


/* =====================================================
                    ENEMY
===================================================== */

function addEnemies(
    count,
    area=250,
    color=0x873737
){

    for(let i=0;i<count;i++){

        const e=
        createHuman(
            color,
            1.1
        );

        e.position.set(
            (Math.random()-.5)*area,
            0,
            (Math.random()-.5)*area
        );

        e.userData.enemy=true;

        scene.add(e);

        enemies.push(e);

    }

}


/* =====================================================
                      TREE
===================================================== */

function addTree(
    x,
    z,
    scale=1
){

    const g=
    new THREE.Group();


    const trunk=
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .7,
            1,
            6,
            10
        ),

        mat(0x68452b)

    );

    trunk.position.y=3;

    g.add(trunk);


    const leaves=
    new THREE.Mesh(

        new THREE.ConeGeometry(
            4*scale,
            9*scale,
            9
        ),

        mat(0x1f702d)

    );

    leaves.position.y=8;

    g.add(leaves);


    g.position.set(
        x,
        0,
        z
    );

    g.castShadow=true;

    scene.add(g);

    trees.push(g);

}


/* =====================================================
                      BUILDING
===================================================== */

function addBuilding(
    x,z,
    w=20,
    h=30,
    d=20
){

    const b=
    new THREE.Group();


    const body=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            w,h,d
        ),

        mat(
            0x444444+
            Math.floor(
                Math.random()*0x222222
            )
        )

    );

    body.position.y=h/2;

    body.castShadow=true;

    b.add(body);


    /* windows */

    for(
        let yy=5;
        yy<h;
        yy+=7
    ){

        for(
            let xx=-w/2+3;
            xx<w/2;
            xx+=6
        ){

            const win=
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    2.5,
                    2.5,
                    .2
                ),

                mat(0x82b8d8)

            );

            win.position.set(
                xx,
                yy,
                d/2+.11
            );

            b.add(win);

        }

    }


    /* door */

    const door=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            3,
            5,
            .3
        ),

        mat(0x191919)

    );

    door.position.set(
        0,
        2.5,
        d/2+.2
    );

    b.add(door);


    b.position.set(
        x,
        0,
        z
    );

    scene.add(b);

    buildings.push(b);

}


/* =====================================================
                       CAR
===================================================== */

function createCar(
    color
){

    const car=
    new THREE.Group();


    const body=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            4.5,
            1.4,
            8
        ),

        mat(color)
    );

    body.position.y=1.5;

    car.add(body);


    const cabin=
    new THREE.Mesh(

        new THREE.BoxGeometry(
            3.3,
            1.5,
            3.8
        ),

        mat(0x20252c)

    );

    cabin.position.y=2.7;

    car.add(cabin);


    for(
        const x of [-2.3,2.3]
    ){

        for(
            const z of [-2.5,2.5]
        ){

            const wheel=
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .75,
                    .75,
                    .5,
                    16
                ),

                mat(0x090909)

            );

            wheel.rotation.z=
                Math.PI/2;

            wheel.position.set(
                x,
                .75,
                z
            );

            car.add(wheel);

        }

    }


    car.userData={
        speed:
            .08+
            Math.random()*.18,
        ai:true
    };


    return car;

}


/* =====================================================
                     ADD CARS
===================================================== */

function addCars(
    count,
    area=400
){

    const colors=[
        0xd22d2d,
        0x2769c5,
        0xf0f0f0,

/* =====================================================
                    INPUT
===================================================== */

function setupInput(){

    window.addEventListener(
        "keydown",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=true;

            if(
                e.key.toLowerCase()==="m"
            ){
                updateMission();
            }

            if(
                e.key.toLowerCase()==="e"
            ){
                vehicleInteraction();
            }

        }
    );


    window.addEventListener(
        "keyup",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=false;

        }
    );


    window.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement===
                renderer.domElement
            ){

                yaw-=e.movementX*.002;

            }

        }
    );


    renderer.domElement.addEventListener(
        "click",
        ()=>{

            renderer.domElement.requestPointerLock();

        }
    );

}


/* =====================================================
                 PLAYER MOVEMENT
===================================================== */

function updatePlayer(){

    if(!player)return;


    let s=
        keys["shift"]
        ? playerSpeed*2
        : playerSpeed;


    if(
        gameType==="RUNNER" ||
        gameType==="RACING" ||
        gameType==="MOTORCYCLE"
    ){

        s*=1.2;

    }


    if(keys["w"] ||
       keys["arrowup"]){

        player.position.z-=s;

    }


    if(keys["s"] ||
       keys["arrowdown"]){

        player.position.z+=s;

    }


    if(keys["a"] ||
       keys["arrowleft"]){

        player.position.x-=s;

        player.rotation.y=
            Math.PI;

    }


    if(keys["d"] ||
       keys["arrowright"]){

        player.position.x+=s;

        player.rotation.y=
            0;

    }


    if(keys[" "]){
        player.position.y=
            Math.min(
                player.position.y+.15,
                4
            );
    }else{
        player.position.y=
            Math.max(
                0,
                player.position.y-.12
            );
    }


    animateHuman(player);

}


/* =====================================================
                 HUMAN AI
===================================================== */

function updateHumans(){

    humans.forEach(h=>{

        let s=
            h.userData.speed;


        if(
            gameType==="RUNNER" ||
            gameType==="RACING"
        ){

            s*=2;

        }


        h.position.z-=s;


        if(
            Math.abs(h.position.z)>450
        ){

            h.position.z=
                -h.position.z;

        }


        animateHuman(h);

    });

}


/* =====================================================
                   ENEMY AI
===================================================== */

function updateEnemies(){

    enemies.forEach(e=>{

        const d=
            e.position.distanceTo(
                player.position
            );


        if(d<100){

            const dir=
                new THREE.Vector3()
                .subVectors(
                    player.position,
                    e.position
                )
                .normalize();


            e.position.add(
                dir.multiplyScalar(.025)
            );


            e.lookAt(
                player.position
            );

            animateHuman(e);

        }

    });

}


/* =====================================================
                   CAR AI
===================================================== */

function updateCars(){

    cars.forEach(car=>{

        if(car===currentCar)
            return;


        car.position.z-=
            car.userData.speed;


        if(
            Math.abs(car.position.z)>500
        ){

            car.position.z=
                -car.position.z;

        }

    });

}


/* =====================================================
               ENTER / EXIT CAR
===================================================== */

function vehicleInteraction(){

    if(!player)return;


    if(currentCar){

        player.visible=true;

        player.position.copy(
            currentCar.position
        );

        currentCar=null;

        document.getElementById(
            "vehicleState"
        ).textContent=
            "ON FOOT";

        return;

    }


    let closest=null;
    let dist=10;


    cars.forEach(car=>{

        const d=
            player.position.distanceTo(
                car.position
            );


        if(d<dist){

            closest=car;
            dist=d;

        }

    });


    if(closest){

        currentCar=closest;

        currentCar.userData.ai=false;

        player.visible=false;

        document.getElementById(
            "vehicleState"
        ).textContent=
            "DRIVING";

    }

}


/* =====================================================
                    DRIVE
===================================================== */

function drive(){

    if(!currentCar)return;


    let s=
        keys["shift"]
        ? .7
        : .4;


    if(keys["w"])
        currentCar.position.z-=s;

    if(keys["s"])
        currentCar.position.z+=s;

    if(keys["a"])
        currentCar.rotation.y+=.04;

    if(keys["d"])
        currentCar.rotation.y-=.04;


    player.position.copy(
        currentCar.position
    );

}


/* =====================================================
                    CAMERA
===================================================== */

function updateCamera(){

    if(!player)return;


    const target=
        currentCar ||
        player;


    const offset=
        new THREE.Vector3(
            0,
            8,
            18
        );


    offset.applyAxisAngle(
        new THREE.Vector3(0,1,0),
        yaw
    );


    const desired=
        target.position
        .clone()
        .add(offset);


    camera.position.lerp(
        desired,
        .08
    );


    camera.lookAt(
        target.position.x,
        target.position.y+3,
        target.position.z
    );

}


/* =====================================================
                     MISSION
===================================================== */

let mission=1;

function updateMission(){

    mission++;

    const objectives=[

        "Reach the marked area",
        "Find the special object",
        "Explore the map",
        "Reach the checkpoint",
        "Complete the challenge",
        "Find the hidden location",
        "Travel to the destination",
        "Collect the objective",
        "Reach the finish",
        "Explore the world"

    ];


    document.getElementById(
        "missionText"
    ).textContent=
        "MISSION "+
        mission+
        " — "+
        objectives[
            Math.floor(
                Math.random()*
                objectives.length
            )
        ];

}


/* =====================================================
                      MINIMAP
===================================================== */

const map=
document.getElementById(
    "minimap"
);

const ctx=
map.getContext("2d");


function updateMinimap(){

    map.width=170;
    map.height=170;


    ctx.fillStyle="#18231c";

    ctx.fillRect(
        0,
        0,
        170,
        170
    );


    ctx.strokeStyle="#555";


    for(
        let i=0;
        i<170;
        i+=20
    ){

        ctx.beginPath();

        ctx.moveTo(i,0);
        ctx.lineTo(i,170);

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(0,i);
        ctx.lineTo(170,i);

        ctx.stroke();

    }


    if(!player)return;


    const px=
        85+
        player.position.x/
        1000*170;


    const py=
        85+
        player.position.z/
        1000*170;


    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        px,
        py,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    cars.slice(0,40)
    .forEach(car=>{

        const x=
            85+
            car.position.x/
            1000*170;

        const y=
            85+
            car.position.z/
            1000*170;


        ctx.fillStyle="orange";

        ctx.fillRect(
            x,
            y,
            3,
            3
        );

    });


    enemies.slice(0,30)
    .forEach(e=>{

        const x=
            85+
            e.position.x/
            1000*170;

        const y=
            85+
            e.position.z/
            1000*170;


        ctx.fillStyle="red";

        ctx.fillRect(
            x,
            y,
            3,
            3
        );

    });

}


/* =====================================================
                       HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent=
        Math.floor(score);


    document.getElementById(
        "health"
    ).textContent=
        Math.max(
            0,
            Math.floor(health)
        );

}


/* =====================================================
                    SCORE
===================================================== */

function updateScore(){

    score+=.03;

    if(score>500){
        level=2;
    }

    if(score>1500){
        level=3;
    }

}


/* =====================================================
                    BACK MENU
===================================================== */

function backToMenu(){

    running=false;

    document.getElementById(
        "hud"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="block";

}


/* =====================================================
                     RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        if(!camera || !renderer)
            return;

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =====================================================
                      GAME LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(running){

        if(currentCar){
            drive();
        }else{
            updatePlayer();
        }


        updateHumans();

        updateEnemies();

        updateCars();

        updateCamera();

        updateScore();

        updateHUD();

        updateMinimap();

    }


    if(renderer){

        renderer.render(
            scene,
            camera
        );

    }

}

animate();

</script>
